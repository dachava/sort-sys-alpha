[project]
name = "sort-sys-alpha"
version = "0.1.0"
description = "A local-LLM file sorter for Windows Downloads folders."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "puremagic>=1.20",
    "pefile>=2024.8.26",
    "fonttools>=4.50",
    "pillow>=10.3",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "mutagen>=1.47",
    "py7zr>=0.22",
]

[project.scripts]
sort-sys-alpha = "sort_sys_alpha.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sort_sys_alpha"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
